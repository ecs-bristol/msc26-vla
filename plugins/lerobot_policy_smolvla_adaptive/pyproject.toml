[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_smolvla_adaptive"
version = "0.1.0"
description = "Project-owned Fixed-H SmolVLA wrapper policy for LeRobot"
requires-python = ">=3.12"
dependencies = [
  "lerobot==0.6.1",
  "libero-edge-benchmark==0.1.0",
  "numpy>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
