[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_smolvla_int4"
version = "0.1.0"
description = "LeRobot policy plugin for 4-bit weight-quantized SmolVLA inference"
requires-python = ">=3.12"
dependencies = [
  "lerobot>=0.6.1,<0.7",
  "numpy>=2,<3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
